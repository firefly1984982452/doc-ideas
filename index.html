  <script>
    window.$docsify = {
      name: '丹的灵感手札',
      nameLink: '#/',
      repo: 'https://github.com/firefly1984982452/doc-ideas',
      noEmoji: false,
      coverpage: true,
      onlyCover: false,
      loadSidebar: true,
      loadNavbar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      mergeNavbar: true,
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      autoHeader: false,
      relativePath: false,
      notFoundPage: '404.md',
      topMargin: 28,
      markdown: {
        breaks: true
      },
      count: {
        countable: true,
        fontsize: '0.78em',
        color: 'var(--text-muted)',
        language: 'chinese'
      },
      pagination: {
        previousText: '上一篇',
        nextText: '下一篇',
        crossChapter: true
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var route = (window.location.hash || '#/').split('?')[0];
            var articleTitle = document.querySelector('.markdown-section h1');
            document.body.classList.toggle('home-page', route === '#/' || route === '#');
            document.body.classList.toggle('archive-page', /^#\/docs\/archive(?:\.md)?$/.test(route));

            document.title = articleTitle
              ? articleTitle.textContent.trim() + ' · 丹的灵感手札'
              : '丹的灵感手札';

            document.querySelectorAll('.markdown-section a:not(.anchor)').forEach(function (link) {
              var href = link.getAttribute('href') || '';
              var isInternal = href.charAt(0) === '#' || href.charAt(0) === '/';
              var isPagination = Boolean(link.closest('.docsify-pagination-container, .pagination-item'));
              if (!href || isInternal || isPagination) return;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
            });

            document.querySelectorAll('.markdown-section > div').forEach(function (element) {
              var text = (element.textContent || '').trim();
              if (/^\d+\s*字\s*\|\s*\d+\s*分钟$/.test(text)) element.classList.add('page-count');
            });

            document.dispatchEvent(new CustomEvent('doc-ideas:rendered'));
          });
        }
      ]
    };
  </script>
